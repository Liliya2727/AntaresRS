name: AntaresRS

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
      - "archdaemon/**"
      - "binder_resolver/**"
      - "binprofiles/**"
      - "binutils/**"
      - "binpreferenced/**"
      - "preloadbin/**"
      - "mainfiles/**"
      - "gamelist.txt"
      - "version"

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    name: Build AntaresRS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 1. binder_resolver APK (release, unsigned)
      #    archdaemon embeds this APK with include_bytes!("../binder_resolver.apk"),
      #    so it has to exist before the Rust binaries are built.
      # ------------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Build Binder Resolver APK (release, unsigned)
        working-directory: ./binder_resolver
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Stage Binder Resolver APK into archdaemon
        run: |
          APK=$(find binder_resolver/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "binder_resolver APK not found" >&2
            exit 1
          fi
          cp "$APK" archdaemon/binder_resolver.apk
          ls -l archdaemon/binder_resolver.apk

      # ------------------------------------------------------------------
      # 2. Rust binaries: archdaemon + binprofiles/binutils/binpreferenced
      # ------------------------------------------------------------------
      - name: NDK Setup
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r29

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build ArchDaemon (sys.azenith-service)
        working-directory: ./archdaemon
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 build --release

      - name: Build Profilesettings (sys.azenith-profilesettings)
        working-directory: ./binprofiles
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 build --release

      - name: Build Utilityconf (sys.azenith-utilityconf)
        working-directory: ./binutils
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 build --release

      - name: Build Preferencedtweaks (sys.azenith-preferencedtweaks)
        working-directory: ./binpreferenced
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 build --release

      # ------------------------------------------------------------------
      # 3. Preload binary (C, ndk-build)
      # ------------------------------------------------------------------
      - name: Compile Preload Binary
        working-directory: ./preloadbin
        run: ndk-build APP_ABI="arm64-v8a armeabi-v7a x86 x86_64"

      # ------------------------------------------------------------------
      # 4. Flashable ZIP
      # ------------------------------------------------------------------
      - name: Compile Flashable Zip
        id: compileZip
        run: bash .github/scripts/compile_zip.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compileZip.outputs.artifactName }}
          path: ${{ steps.compileZip.outputs.zipName }}
          if-no-files-found: error
