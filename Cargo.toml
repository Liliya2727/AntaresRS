[workspace]
resolver = "2"
members = [
    "crates/azenith-common",
    "crates/azenith-daemon",
    "crates/azenith-preload",
    # The four pre-existing standalone crates, folded in as workspace members
    # (Phase 2). Their logic is unchanged; only the manifest is rewritten to
    # use workspace lints and dependency versions.
    "thermalcore",
    "binprofiles",
    "binutils",
    "binpreferenced",
]
# They are inside the workspace directory, so Cargo would otherwise refuse them.
exclude = []

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "1.0.0"

[workspace.dependencies]
# NOTE: `nix` has no `fcntl` feature — requesting it fails to resolve.
nix = { version = "0.30", features = ["poll", "inotify", "signal", "fs", "process", "user"] }
inotify = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "2.0"
glob = "0.3"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# ponytail: opt-level 'z' everywhere except thermalcore, which is compute-bound.
# opt-level 3 there buys real FLOPS; 'z' on the daemon only saves bytes the
# module zip does not meaningfully care about.
[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.release.package.rianixia-thermalcore]
opt-level = 3
