[package]
name = "azenith-preferencedtweaks"
version = "1.0.0"
edition = "2024"
description = "AZenith Preference tweaks binary"

# [profile.release] intentionally omitted: profiles are workspace-wide only
# (a per-crate [profile.*] in a member is ignored and emits a warning).

[lib]
name = "azenith_preferencedtweaks"
path = "src/lib.rs"

[[bin]]
# Cargo rejects `.` in [[bin]] names; the on-device name
# sys.azenith-preferencedtweaks is applied at packaging time.
name = "preferredtweaks"
path = "src/main.rs"

[dependencies]
glob = { workspace = true }
