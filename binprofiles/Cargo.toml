[package]
name = "azenith-profilesettings"
version = "1.0.0"
edition = "2024"
description = "AZenith Profiler binaries"

[lib]
name = "azenith_profilesettings"
path = "src/lib.rs"

# [[bin]] has no `.` in its name: Cargo rejects that outright, and the unified
# sys.azenith-service owns this logic now (plan Q1). main.rs stays only as a
# standalone runner during the transition.

[[bin]]
name = "profilesettings"
path = "src/main.rs"

[dependencies]
glob = { workspace = true }
