[package]
name = "azenith-utilityconf"
version = "1.0.0"
edition = "2024"
description = "AZenith Utility binaries"

# [profile.release] intentionally omitted: profiles are workspace-wide only
# (a per-crate [profile.*] in a member is ignored and emits a warning).

[lib]
name = "azenith_utilityconf"
path = "src/lib.rs"

[[bin]]
# Cargo rejects `.` in [[bin]] names, so the on-device name sys.azenith-utilityconf
# is applied at packaging time, not here.
name = "utilityconf"
path = "src/main.rs"

[dependencies]
glob = { workspace = true }
