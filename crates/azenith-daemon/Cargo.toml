[package]
name = "azenith-daemon"
description = "AZenith service daemon: event loop, CLI and profile orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo rejects `.` in a `[[bin]]` name, so the target stays `azenith-daemon`
# and `compile_zip.sh` installs it as `sys.azenith-service`.
[lib]
name = "azenith_daemon"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Plan Q1 (Option A): the four former standalone binaries are libraries now, so
# `sys.azenith-service <subcommand>` is a direct call instead of a fork+exec.
# This also makes their ppid "is my parent sys.azenith-service" guards dead code.
# `thermalcore` stays a binary too (plan: keep its own long-lived process), but
# its run loop is a lib fn so the daemon can start it if that ever changes.
azenith-common = { path = "../azenith-common" }
azenith-profilesettings = { path = "../../binprofiles" }
azenith-utilityconf = { path = "../../binutils" }
azenith-preferencedtweaks = { path = "../../binpreferenced" }
rianixia-thermalcore = { path = "../../thermalcore" }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true }
